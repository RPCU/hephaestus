name: Publish OpenStack Images
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/AGENTS.md"
      - "**/docs/**"
  workflow_dispatch:
# Never cancel an upload half-way and never run two at once: both could pick
# the same revision name, and CAPO fails on duplicate image names.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  versions:
    runs-on: self-hosted
    outputs:
      kubernetes: ${{ steps.versions.outputs.kubernetes }}
    steps:
      - name: Per-job Nix fetcher cache
        # The runners' HOME persists between jobs, and once isaac's auto-GC
        # (min-free) deletes an eval-only fetchTarball source, a shared cache
        # keeps pointing at the dead store path ("getting status of
        # /nix/store/…-source/…: No such file or directory").
        run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get Nixpkgs revision
        run: |
          # This should not be a URL, because it would allow PRs to run arbitrary code in CI!
          url=$(jq -r .pins.nixpkgs.url npins/sources.json)
          echo "url=$url" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=${{ env.url }}
      - name: Supported Kubernetes versions
        id: versions
        # Latest patch of the two newest minors with a nixpkgs-k8s pin (default.nix)
        run: |
          versions=$(nix-instantiate --eval --strict --json default.nix -A supportedKubernetesVersions)
          echo "$versions"
          echo "kubernetes=$versions" >> "$GITHUB_OUTPUT"
  publish:
    needs: versions
    timeout-minutes: 120
    # Self-hosted: isaac reaches keystone/glance on *.rpcu.vpn through netbird
    runs-on: self-hosted
    strategy:
      # One at a time: images are several GB each on the runner disk
      max-parallel: 1
      fail-fast: false
      matrix:
        profile:
          - kaas
        kubernetes: ${{ fromJson(needs.versions.outputs.kubernetes) }}
    steps:
      - name: Per-job Nix fetcher cache
        # The runners' HOME persists between jobs, and once isaac's auto-GC
        # (min-free) deletes an eval-only fetchTarball source, a shared cache
        # keeps pointing at the dead store path ("getting status of
        # /nix/store/…-source/…: No such file or directory").
        run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get Nixpkgs revision
        run: |
          # This should not be a URL, because it would allow PRs to run arbitrary code in CI!
          url=$(jq -r .pins.nixpkgs.url npins/sources.json)
          echo "url=$url" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=${{ env.url }}
          extra_nix_config: |
            fallback = true
            trusted-public-keys = didactiklabs-nixcache:PxLKN0+ZkP07M8g8/B6xbP6A4MYpqQg6LH7V3muiy/0= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://s3.didactiklabs.io/nix-cache https://cache.nixos.org/
      - name: Check OpenStack is reachable
        # The runner host (isaac, didactiklabs/nixOS-server) is on the RPCU
        # netbird mesh; jobs can't run netbird themselves (NoNewPrivileges).
        # Runner PATH only has the runners' extraPackages: get the tools from nixpkgs
        run: |
          nix-shell -p getent curl --run '
            getent hosts keystone.rpcu.vpn
            curl -fsSk -o /dev/null -w "keystone: %{http_code}\n" https://keystone.rpcu.vpn/v3
          '
      - name: OpenStack credentials
        env:
          CLOUDS_YAML: ${{ secrets.OPENSTACK_CLOUDS_YAML }}
        run: |
          # Same clouds.yaml as the CAPO `capo-variables` secret (cloud `openstack`),
          # so images land in the project CAPO resolves image names in.
          umask 077
          printf '%s\n' "$CLOUDS_YAML" > "$RUNNER_TEMP/clouds.yaml"
          echo "OS_CLIENT_CONFIG_FILE=$RUNNER_TEMP/clouds.yaml" >> "$GITHUB_ENV"
          echo "OS_CLOUD=openstack" >> "$GITHUB_ENV"
      - name: Build and publish (${{ matrix.profile }} v${{ matrix.kubernetes }})
        run: |
          export NIXPKGS_ALLOW_UNFREE=1
          nix-shell -p openstackclient qemu-utils jq git --run "scripts/uploadGlanceImage '${{ matrix.profile }}' '${{ matrix.kubernetes }}'"
      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/clouds.yaml"
  chihiro:
    # Offer every version with an image in Glance in chihiro: opens (or
    # updates) a PR on RPCU/hestia and merges it. Runs whether or not every
    # publish job of this run succeeded.
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: self-hosted
    steps:
      - name: Per-job Nix fetcher cache
        run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: RPCU
          repositories: hestia
      - name: Checkout hestia
        uses: actions/checkout@v4
        with:
          repository: RPCU/hestia
          token: ${{ steps.app-token.outputs.token }}
          path: hestia
      - name: Get Nixpkgs revision
        run: |
          # This should not be a URL, because it would allow PRs to run arbitrary code in CI!
          url=$(jq -r .pins.nixpkgs.url npins/sources.json)
          echo "url=$url" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=${{ env.url }}
      - name: OpenStack credentials
        env:
          CLOUDS_YAML: ${{ secrets.OPENSTACK_CLOUDS_YAML }}
        run: |
          umask 077
          printf '%s\n' "$CLOUDS_YAML" > "$RUNNER_TEMP/clouds.yaml"
          echo "OS_CLIENT_CONFIG_FILE=$RUNNER_TEMP/clouds.yaml" >> "$GITHUB_ENV"
          echo "OS_CLOUD=openstack" >> "$GITHUB_ENV"
      - name: Update chihiro versions
        id: update
        run: |
          nix-shell -p openstackclient python3 --run \
            "openstack image list --status active -f json | scripts/updateChihiroVersions hestia/openchoreo/namespaces/rpcu/projects/testing/chihiro.yaml" \
            | tee "$RUNNER_TEMP/versions.txt"
          {
            echo 'versions<<EOF'
            cat "$RUNNER_TEMP/versions.txt"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/clouds.yaml"
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          path: hestia
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "feat(chihiro): sync Kubernetes versions with hephaestus Glance images"
          title: "feat(chihiro): sync Kubernetes versions with hephaestus Glance images"
          body: |
            Generated by RPCU/hephaestus `scripts/updateChihiroVersions` from the active `hephaestus-kaas-*` images in Glance (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Version → image (newest image per version wins):
            ```
            ${{ steps.update.outputs.versions }}
            ```

            New versions are added after the first `CHIHIRO_AVAILABLE_VERSIONS` entry, which stays the default for new clusters. Nothing is removed.
          branch: hephaestus-chihiro-versions
          delete-branch: true
      - name: Merge Pull Request
        # hestia has auto-merge disabled and main unprotected: merge directly
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" -R RPCU/hestia --rebase --delete-branch
