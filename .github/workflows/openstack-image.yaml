name: Publish OpenStack Images
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/AGENTS.md"
      - "**/docs/**"
  workflow_dispatch:
# Never cancel an upload half-way and never run two at once: both could pick
# the same revision name, and CAPO fails on duplicate image names.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  publish:
    timeout-minutes: 120
    # Self-hosted: needs to reach keystone/glance on *.rpcu.vpn
    runs-on: self-hosted
    strategy:
      max-parallel: 1
      matrix:
        profile:
          - kaas
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get Nixpkgs revision
        run: |
          # This should not be a URL, because it would allow PRs to run arbitrary code in CI!
          url=$(jq -r .pins.nixpkgs.url npins/sources.json)
          echo "url=$url" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=${{ env.url }}
          extra_nix_config: |
            fallback = true
            trusted-public-keys = didactiklabs-nixcache:PxLKN0+ZkP07M8g8/B6xbP6A4MYpqQg6LH7V3muiy/0= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://s3.didactiklabs.io/nix-cache https://cache.nixos.org/
      - name: Join netbird
        # The runner is not on the mesh; keystone/glance (*.rpcu.vpn) only are.
        # Use an *ephemeral* setup key so the peer is dropped automatically
        # once it goes offline.
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          nb=$(nix-build '<nixpkgs>' -A netbird --no-out-link)/bin/netbird
          nbargs=(--daemon-addr "unix://$RUNNER_TEMP/netbird.sock" --log-file "$RUNNER_TEMP/netbird.log")
          echo "NB=$nb" >> "$GITHUB_ENV"
          echo "NB_DAEMON_ADDR=unix://$RUNNER_TEMP/netbird.sock" >> "$GITHUB_ENV"
          (umask 077; printf '%s' "$NB_SETUP_KEY" > "$RUNNER_TEMP/netbird.key")
          sudo nohup "$nb" service run --config "$RUNNER_TEMP/netbird.json" "${nbargs[@]}" >/dev/null 2>&1 &
          for _ in $(seq 30); do [ -S "$RUNNER_TEMP/netbird.sock" ] && break; sleep 1; done
          sudo "$nb" up "${nbargs[@]}" \
            --management-url https://netbird.rpcu.io \
            --hostname "gha-hephaestus-${{ github.run_id }}" \
            --setup-key-file "$RUNNER_TEMP/netbird.key"
          rm -f "$RUNNER_TEMP/netbird.key"
          for _ in $(seq 60); do
            getent hosts keystone.rpcu.vpn >/dev/null && break
            sleep 2
          done
          sudo "$nb" status "${nbargs[@]}"
          getent hosts keystone.rpcu.vpn
      - name: OpenStack credentials
        env:
          CLOUDS_YAML: ${{ secrets.OPENSTACK_CLOUDS_YAML }}
        run: |
          # Same clouds.yaml as the CAPO `capo-variables` secret (cloud `openstack`),
          # so images land in the project CAPO resolves image names in.
          umask 077
          printf '%s\n' "$CLOUDS_YAML" > "$RUNNER_TEMP/clouds.yaml"
          echo "OS_CLIENT_CONFIG_FILE=$RUNNER_TEMP/clouds.yaml" >> "$GITHUB_ENV"
          echo "OS_CLOUD=openstack" >> "$GITHUB_ENV"
      - name: Build and publish (${{ matrix.profile }})
        run: |
          export NIXPKGS_ALLOW_UNFREE=1
          nix-shell -p openstackclient qemu-utils jq git --run "scripts/uploadGlanceImage '${{ matrix.profile }}'"
      - name: Cleanup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/clouds.yaml"
          if [ -n "${NB:-}" ]; then
            sudo "$NB" down --daemon-addr "$NB_DAEMON_ADDR" || true
            sudo pkill -f "$NB service run" || true
            sudo rm -f "$RUNNER_TEMP/netbird.json"
          fi
